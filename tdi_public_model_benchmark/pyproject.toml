[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdi-public-model-benchmark"
version = "0.1.0"
description = "Benchmark public CYP model scores against OpenADMET TDI labels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "rdkit>=2023.9",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tdi-benchmark = "tdi_public_model_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
